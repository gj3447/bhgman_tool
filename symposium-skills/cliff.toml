# git-cliff configuration — SYMPOSIUM/SKILLS
# Keep a Changelog 1.1.0 + Conventional Commits 1.0.0 grounding
# KG: ATOM_PROM16_skill_versioning_2026-04-29 / lesson-prom16-skill-versioning-academic-2026-04-29

[changelog]
header = """
# Changelog

> SYMPOSIUM/SKILLS 변천사. [Keep a Changelog 1.1.0](https://keepachangelog.com/en/1.1.0/) 형식.
> Conventional Commits 1.0.0 자동 분류. git-cliff 자동 생성 — 직접 편집 금지.
>
> 학문 grounding: PROM 16 (`PROM_16_SKILL_VERSIONING_REPORT.md`) — Lehman SCM 8 laws / SemVer 2.0.0 / Adams-McIntosh SANER 2016 / SLSA v1.0.
> KG: `lesson-prom16-skill-versioning-academic-2026-04-29` (16/16 ResearchFinding, 10 seeds).

"""

body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([`{{ commit.id | truncate(length=7, end="") }}`](#{{ commit.id }}))\
    {% endfor %}
{% endfor %}

"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true
postprocessors = [
    { pattern = '\$REPO', replace = "https://github.com/SYMPOSIUM-PROJECT/skills" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^style", group = "<!-- 4 -->Styling" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^docs", group = "<!-- 6 -->Documentation" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
    { body = ".*security", group = "<!-- 8 -->Security" },
    { message = "^revert", group = "<!-- 9 -->Reverted" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
