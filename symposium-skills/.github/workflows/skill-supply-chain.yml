# SYMPOSIUM/SKILLS — supply chain hardening workflow
# Plan-3 phase 3 (consensus seed cg-skillver-slsa-sigstore-attestation-2026-04-26)
#
# Activates automatically once a GitHub remote is configured AND this branch is pushed.
# Until then, lives as committed-but-dormant infrastructure.
#
# Pipeline (on push to main + PR):
#   1. drift gate     — skill-merkle-check.py (must pass)
#   2. validator      — skill-validator.sh --all + --manifest-check
#   3. SBOM           — regenerate SBOM.json (CycloneDX 1.5)
#   4. attestation    — regenerate in-toto SLSA Provenance v1
#   5. sigstore sign  — cosign keyless via Fulcio + Rekor (OIDC, no long-lived secrets)
#   6. provenance     — actions/attest-build-provenance (npm-style)
#   7. publish OCI    — oras push to ghcr.io (only on tag push)

name: skill-supply-chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write     # OIDC for cosign keyless + Trusted Publishers
  attestations: write
  packages: write

jobs:
  drift-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install jq
        run: sudo apt-get install -y jq
      - name: merkle drift gate
        run: python3 bin/skill-merkle-check.py --tolerate-uncommitted
      - name: validator (frontmatter + manifest)
        run: |
          bash bin/skill-validator.sh --all
          bash bin/skill-validator.sh --manifest-check

  build-attest-sign:
    needs: drift-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: sigstore/cosign-installer@v3
      - name: rebuild SBOM
        run: python3 bin/skill-build-sbom.py
      - name: rebuild attestation skeleton
        run: python3 bin/skill-build-attestation.py
      - name: cosign keyless sign — MANIFEST.json
        run: cosign sign-blob --yes MANIFEST.json --output-signature MANIFEST.json.sig --output-certificate MANIFEST.json.pem
      - name: cosign keyless sign — SBOM.json
        run: cosign sign-blob --yes SBOM.json --output-signature SBOM.json.sig --output-certificate SBOM.json.pem
      - name: GitHub native build provenance (npm-style)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            MANIFEST.json
            SBOM.json
            .well-known/skills/index.json
            .well-known/skills/attestation.json
      - name: upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: symposium-skills-signed
          path: |
            MANIFEST.json
            MANIFEST.json.sig
            MANIFEST.json.pem
            SBOM.json
            SBOM.json.sig
            SBOM.json.pem
            .well-known/skills/

  publish-oci:
    needs: build-attest-sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: oras push
        env:
          SKILLVER_OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/symposium-skills
          SKILLVER_OCI_TAG: ${{ github.ref_name }}
        run: bash bin/skill-build-oci.sh --push
