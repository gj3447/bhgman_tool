[project]
name = "bhgman_tool"
version = "0.1.0"
description = "비행기맨(#4 사도)의 공학적 결정화 (Harness) 측 도구 모음. 본 repo = 도구 layer (본질 측 정전은 별도). 17 axes external grounding + 50 Lean 4 verified theorem + Goodhart safeguard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "gj3447 (METAHUMOTONIC)", email = "gj3447@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "multi-agent",
    "claude-code",
    "harness",
    "formal-verification",
    "lean4",
    "knowledge-graph",
    "reference-binding",
    "drift-detection",
    "goodhart-safeguard",
    "longinus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.1",
]
# APT v27 A6 pre-prompt resolver (engine/resolver, Wave 7 P3-H 2026-05-14)
resolver = [
    "python-frontmatter>=1.1.0",
    "Jinja2>=3.1.4",
    "neo4j>=5.20.0",
]
# APT v27 A7 fail-closed gate endpoint (engine/gate, Wave 7 P3-H 2026-05-14)
gate = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0",
    "neo4j>=5.20.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "httpx>=0.27",
]
# engine.longinus_drift_audit (Pydantic v2 runtime + Neo4j client + retry)
longinus = [
    "neo4j>=5.20.0",
    "tenacity>=9.0",
]
# Test deps for resolver + gate test suites
resolver-test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
gate-test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.24",
]
# Convenience aggregate — everything except dev tools
all = [
    "python-frontmatter>=1.1.0",
    "Jinja2>=3.1.4",
    "neo4j>=5.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.scripts]
bhgman-tool = "engine.cli.main:cli"

[project.urls]
Homepage = "https://github.com/gj3447/bhgman_tool"
Repository = "https://github.com/gj3447/bhgman_tool"
Issues = "https://github.com/gj3447/bhgman_tool/issues"
Documentation = "https://github.com/gj3447/bhgman_tool/tree/main/docs"
Changelog = "https://github.com/gj3447/bhgman_tool/commits/main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.hatch.build.targets.sdist]
include = [
  "/engine",
  "/skills",
  "/docs",
  "/lean",
  "/bin",
  "/README.md",
  "/README.ko-KR.md",
  "/README.zh-CN.md",
  "/README.ja-JP.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/.pytest_cache",
  "**/.complexipy_cache",
  "**/*.egg-info",
  "/.venv",
  "/dist",
  "/build",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["engine"]
python_files = "test_*.py"
