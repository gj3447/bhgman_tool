[project]
name = "bhgman_tool"
version = "0.1.0"
description = "비행기맨(#4 사도)의 공학적 결정화 (Harness) 측 도구 모음. 본 repo = 도구 layer (본질 측 정전은 별도). 17 axes external grounding + 50 Lean 4 verified theorem + Goodhart safeguard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "gj3447 (METAHUMOTONIC)", email = "gj3447@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "multi-agent",
    "claude-code",
    "harness",
    "formal-verification",
    "lean4",
    "knowledge-graph",
    "reference-binding",
    "drift-detection",
    "goodhart-safeguard",
    "longinus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
bhgman-tool = "engine.cli.main:cli"

[project.urls]
Homepage = "https://github.com/gj3447/bhgman_tool"
Repository = "https://github.com/gj3447/bhgman_tool"
Issues = "https://github.com/gj3447/bhgman_tool/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["engine"]
python_files = "test_*.py"
