[project]
name = "bhgman_tool"
version = "0.1.0"
description = "비행기맨(#4 사도)의 공학적 결정화 (Harness) 측 도구 모음. 본 repo = 도구 layer (본질 측 정전은 별도). 17 axes external grounding + 89 Lean 4 verified theorem/lemma (Mathlib-free standalone, lean exit 0; 105 across the lean/ tree incl. the 16-theorem apt_functor_with_mathlib sister-project) + Goodhart safeguard."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "gj3447 (METAHUMOTONIC)", email = "gj3447@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "multi-agent",
    "claude-code",
    "harness",
    "formal-verification",
    "lean4",
    "knowledge-graph",
    "reference-binding",
    "drift-detection",
    "goodhart-safeguard",
    "longinus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff==0.15.21",  # pinned — must match .pre-commit-config.yaml rev + ci.yml lint job (no skew)
    "mypy==2.3.0",  # pinned — pre-commit uvx + CI uv-run must resolve the SAME version (no skew)
    "build>=1.2",
    "twine>=5.1",
    "deptry>=0.23",
    "pre-commit>=4.0",  # wave11 — 4-ratchet local gate (lesson-bhgman-tool-quality-ratchet-drift-2026-05-17)
    "hypothesis>=6.0",  # property-based testing (test_delta_lens_properties.py); moved from DEP001 ignore 2026-05-21 per vr-bhgman-442702e L2-F2
]
# APT v27 A6 pre-prompt resolver (engine/resolver, Wave 7 P3-H 2026-05-14)
resolver = [
    "python-frontmatter>=1.1.0",
    "Jinja2>=3.1.4",
    "neo4j>=5.20.0",
]
# code_to_kg — tree-sitter source→KG ingestion (POC 2, prom16-code-to-kg-2026-05-28)
code_to_kg = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "jedi>=0.19",  # LSP-grade cross-file CALLS/INHERITS enrichment (enrich.py)
]
# provexport — KG findings → W3C PROV-O / nanopub interop (ADR prov-o-nanopub-export-2026-05-30)
provexport = [
    "prov>=2.1",
    "rdflib>=7.0",
    "lxml>=5.0",  # prov serializer registry eager-loads provxml
]
# hades — format-preserving Extract-Superclass (libcst CST roundtrip keeps comments/
# layout; engine falls back to the stdlib-ast canonical path if libcst is absent)
hades-cst = [
    "libcst>=1.4",
]
# eureka — true-Leiden offline community detection (Traag-Waltman-vanEck 2019);
# the offline CNM/greedy operator stays the no-dep default, this is the opt-in upgrade
eureka-leiden = [
    "leidenalg>=0.10",
    "python-igraph>=0.11",
]
# APT v27 A7 fail-closed gate endpoint (engine/gate, Wave 7 P3-H 2026-05-14)
gate = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0",
    "neo4j>=5.20.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "httpx>=0.27",
]
# engine.longinus_drift_audit (Pydantic v2 runtime + Neo4j client + retry)
longinus = [
    "neo4j>=5.20.0",
    "tenacity>=9.0",
]
# OTel GenAI-semconv dispatch trace channel (engine/longinus_drift_audit/otel_channel.py,
# Wave 12 2026-05-25, PROM 16 prom16-ai-dev-tools lever ①). Graceful no-op when absent.
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
# LLM 군단장 런타임 (engine/agents — 프로메테우스 research / 나생문 critique / 재배맨 dispatch).
# Anthropic API 호출. 부재 시 AgentRuntimeUnavailable → CLI가 skill-route fallback (2026-05-28).
agents = [
    "anthropic>=0.40",
]
# MCP server (engine/mcp_server) — exposes the 7 commanders + APT/TPA as Claude-Code-callable
# tools over FastMCP. Opt-in so the default install stays lean; run: `uv run --extra mcp python -m
# engine.mcp_server` (or `pip install 'bhgman_tool[mcp]'`). Absent → engine.mcp_server import fails
# with a clear "pip install fastmcp" message (engine/mcp_server/__main__.py).
mcp = [
    "fastmcp>=2.0",
]
# OQ1c — 비대칭(Ed25519) verdict 게이트. Opt-in: AsymmetricVerdictGate 가 cryptography 를
# lazy-import 한다. 부재 시 명확한 ImportError 이며, 대칭 HMAC 게이트(stdlib)는 그대로 동작.
# KG: oq-hades-verdict-asymmetric-key-2026-06-20
verdict-asym = [
    "cryptography>=42",
]
# Semantic memory / occam --semantic — real sentence-transformers embeddings + HNSW recall
# (engine/memory). Absent → deterministic hash-fallback embedder whose cosine similarities
# are meaningless, so `occam --semantic --apply` REFUSES without it (W1-B). Mirrors
# engine/memory/pyproject.toml [project.optional-dependencies].full.
memory = [
    "sentence-transformers>=2.7",
    "hnswlib>=0.8",
]
# Harness Console PR1 — Postgres-preferred event store. FastAPI/GUI dependencies
# land incrementally; this extra enables Postgres storage and the HTTP API.
# KG: task-harness-console-event-store-2026-06-24
harness-console = [
    "fastapi>=0.115.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.32.0",
]
# APT vNext Slice 1B — PostgreSQL parity for the durable event-store port.
# The adapter imports psycopg lazily so SQLite-only/default installs stay lean.
# KG: apt-tpa-legion-engine-canon-2026-06-12
# Design: SYMPOSIUM/THEORY/APT/vnext/APT_ENGINE_FSM_DESIGN_2026-07-13.md §12.1
apt-postgres = [
    "psycopg[binary]>=3.2",
]
# Test deps for resolver + gate test suites
resolver-test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[neo4j]>=4.0",
]
gate-test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.24",
]
# Convenience aggregate — everything except dev tools
# Self-referential union of every runtime feature extra (drift-proof: a dep added to
# any extra below now flows into [all] automatically). Excludes dev / resolver-test /
# gate-test (tooling-only). Was a hand-maintained flat list that silently omitted
# code_to_kg / provexport / hades-cst / eureka-leiden / memory / verdict-asym
# (bhg-f-all-extra-incomplete, 2026-06-16 audit).
all = [
    "bhgman_tool[resolver,code_to_kg,provexport,hades-cst,eureka-leiden,gate,longinus,otel,agents,mcp,verdict-asym,memory,harness-console,apt-postgres]",
]
# 세 자매 방법론 (sibling repos under PROJECT/PI) — DEV-ONLY, intentionally NOT a package extra:
#   ooptdd        — log-based / positive-TDD trace gates (pytest11 plugin; memory backend)
#   ooptdd-loop   — agent loop: trace gate + Longinus binding + KG + OMD bridge
#   omd           — 입체운행물방울 parallel-dev coordinator (disjoint write-set orbits)
# These live in a PRIVATE different org (airobotics-ailab) and are not on any index, so they are
# NOT declared as an extra: that kept `uv ... --all-extras` (CI) from resolving them and going red.
# Install on a dev box (the in-repo ooptdd/*_adapter.py + engine/**/test_*_ooptdd.py use them):
#   uv pip install --python .venv/bin/python -e ../ooptdd -e ../ooptdd-loop -e ../omd
# The test_*_ooptdd.py files `pytest.importorskip("ooptdd.backends")` so CI skips them like the
# leiden/lean/fakeredis optional-tool tests — the engine behaviour they instrument is covered by
# the regular tests. (To verify the instrumentation in CI too, publish the siblings to a private
# index and depend on versioned releases — see the merge-to-main discussion.)

[project.scripts]
bhgman-tool = "engine.cli.main:cli"

[project.urls]
Homepage = "https://github.com/gj3447/bhgman_tool"
Repository = "https://github.com/gj3447/bhgman_tool"
Issues = "https://github.com/gj3447/bhgman_tool/issues"
Documentation = "https://github.com/gj3447/bhgman_tool/tree/main/docs"
Changelog = "https://github.com/gj3447/bhgman_tool/commits/main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
# Keep test code out of the installed namespace (tests stay in the sdist + source repo).
exclude = [
  "**/tests",
  "**/test_*.py",
  "**/conftest.py",
  "**/bench",
  "**/*.md",  # docs/notes bundled under engine/ are not runtime code (bhg-f-wheel-doc-bloat)
]

[tool.hatch.build.targets.sdist]
include = [
  "/engine",
  "/skills",
  "/docs",
  "/lean",
  "/bin",
  "/README.md",
  "/README.ko-KR.md",
  "/README.zh-CN.md",
  "/README.ja-JP.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/.pytest_cache",
  "**/.complexipy_cache",
  "**/*.egg-info",
  "/.venv",
  "/dist",
  "/build",
  # symposium-skills is a separate git submodule with its own dependency context
  # (numpy/scipy in its bin/ scripts) — bhgman_tool's deptry must not audit it.
  "symposium-skills",
  # GIT/ — external OSS clone nest (falsifier / TPA absorption targets), gitignored.
  "GIT",
]

[tool.uv]
# Security floor on a transitive dep (fastapi[gate] → starlette). uv.lock is
# gitignored, so the CVE remediation is persisted here (tracked) not in the lock.
# starlette 1.0.0 = PYSEC-2026-161 (fix ≥1.0.1). Found by pip-audit, SYMPOSIUM
# PROM 16 종속성 cycle P2 (2026-05-27).
constraint-dependencies = ["starlette>=1.0.1"]

# NOTE: no [tool.uv.sources] for the ooptdd/ooptdd-loop/omd siblings — they are dev-only and
# NOT declared deps (see the comment by the removed [sisters] extra above), so `uv` never tries
# to resolve the private cross-org paths during `--all-extras`. Dev installs them editably by hand.

# ooptdd session-level plugin (engine/.../tests author per-test gates explicitly;
# this drives the once-per-session ship+verify of pytest's own outcome summary).
# memory backend = zero infra / deterministic / `reachable` always True on this box.
# verify=warn never fails the build; flip to strict only against a REAL reachable store.
[tool.ooptdd]
backend = "memory"
service = "bhgman.tests"
verify = "warn"

[tool.ruff]
line-length = 100
target-version = "py311"
# These five v3 experiment artifacts are byte-for-byte inputs to the frozen
# manifest and 3,661-record evidence set. Formatting them in place would make
# the preregistered run unreplayable. New efficacy code remains fully gated.
extend-exclude = [
  "engine/efficacy/diagnostic_repair_harness.py",
  "engine/efficacy/lean_headroom_run.py",
  "engine/efficacy/lean_sandbox_runner_macos.py",
  "engine/efficacy/tests/test_diagnostic_repair_contracts.py",
  "engine/efficacy/tests/test_diagnostic_repair_harness.py",
]

[tool.ruff.lint.per-file-ignores]
# Test files commonly use `sys.path.insert(...)` before imports to bridge package roots
# (pattern across engine/*/tests/ since longinus_drift_audit standalone + unified pytest).
# E402 is intentional here, not a code smell.
"**/tests/test_*.py" = ["E402"]

[tool.mypy]
# Type-check shipping engine source. Adopted 2026-05-31 (was declared in deps but
# never configured — duplicate-conftest crash + flat-layout imports blocked it).
python_version = "3.11"
files = ["engine"]
# Pydantic v2 models (AbstractClass, dispatch_eval, ...) need the plugin so Field(None)
# defaults are understood (else mypy flags optional fields as missing __init__ args).
plugins = ["pydantic.mypy"]
# Third-party libs without stubs (fastmcp, testcontainers, igraph, ...) and the
# standalone mcp_server package's own bare-name imports are out of scope for the gate.
ignore_missing_imports = true
# Legacy adoption: untyped function bodies are not retro-annotated wholesale yet.
check_untyped_defs = false
exclude = '(/tests/|/bench/|/_archive/|/vendor/|\.venv|\.egg-info|/policies/)'

[[tool.mypy.overrides]]
# mcp_server ships as its own installable package (bhgman_tool_mcp_server) with
# top-level `mcp_server.*` imports; type-check it in its own CI, not the engine gate.
module = "engine.mcp_server.*"
ignore_errors = true

[[tool.mypy.overrides]]
# hades.extract_superclass is under a parallel real-CST rewrite and currently uses
# ast.ClassDef(type_params=...) which only exists on py3.12+ — a real py3.11 incompat
# to fix at source (or bump requires-python). Deferred to avoid racing the live edit.
module = "engine.hades.extract_superclass"
ignore_errors = true

[[tool.mypy.overrides]]
# numpy (transitive via torch/scikit-learn/sentence-transformers — not imported by
# engine/ first-party code) now ships PEP-695 `type` statements in its bundled stubs
# (numpy/__init__.pyi: `type _Falsy = ...`), 3.12+ syntax. Under our py3.11 analysis
# target mypy raised `[syntax] Type statement is only supported in Python 3.12 and
# greater` while parsing that third-party stub and aborted the whole run ("errors
# prevented further checking") — masking every real engine error. We don't own numpy's
# stubs, so skip following into them (same don't-gate-third-party-stubs stance as the
# global ignore_missing_imports). First-party py3.11 gating is fully preserved.
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.deptry]
# Local source packages (resolved via sys.path inject in tests + via hatch package config).
# longinus_drift_audit is a flat-layout standalone subpackage — its tests import submodules
# by bare names (`models`, `kg_client`, etc.) via sys.path bridge in tests/conftest.py.
known_first_party = [
  "engine", "mcp_server", "memory", "analyze", "frontmatter_parser",
  "models", "ged_metric", "reference_layers", "reverse_orphan_scan",
  "sha256_baseline", "kg_client", "forward_orphan_scan",
  "bx_lens", "code_scanner", "daemon", "daemon_cli", "drift_detector",
  "audit_runner",
  # Wave 9c DIP refactor — DeltaCategoryRegistry + DeltaLens core
  "delta_lens", "delta_category_registry", "edit_lens_line_range",
  # Wave 12c SRP split — KG binding facade + 5 submodules
  "kg_binding_state", "kg_binding_delta", "kg_binding_categories",
  "kg_binding_lenses", "kg_binding_registry_install", "kg_binding_delta_lens",
  # v3.4 multi-channel drift detectors + dispatch probe + scip adapter
  "prov_channel", "intoto_channel", "embedding_channel", "urdna2015_channel",
  "dynamic_dispatch_probe", "scip_adapter",
  # Wave 12 — PROM16 ai-dev-tools levers (OTel channel + deterministic dispatch eval)
  "otel_channel", "dispatch_eval",
  # engine/occam — 오캄 결정화 + 나생문 oracle-lens (Legion step 1+2, flat-layout bare imports)
  # + 실전화 2026-05-27: KG read/write IO 어댑터 + end-to-end runner
  "occam", "occam_models", "oracle_lens", "kg_adapter", "occam_runner",
  # engine/longinus_drift — eureka-l8-rectification split (drift부, root-scanned; eureka는 extend-exclude)
  "ged_drift_detector", "nightly_drift_check",
  # engine/legion — 7군단장 합성 orchestrator (Legion step 5, flat-layout bare imports)
  "legion", "legion_models",
  # engine/hades — 7번째 동사 실현(materialize, 유레카 dual), flat-layout bare imports
  # + 실전화 2026-05-27: ACCEPTED 추상 fetch → realize end-to-end runner
  "hades", "hades_models", "hades_runner", "extract_superclass",
  # engine/kg_local — neo4j-free 로컬 KG backend (2026-05-28), flat-layout bare imports
  "schema", "store", "runner", "floating_scan",
  # engine/agents — LLM 군단장 런타임 (재배맨 dispatch / 프로메테우스 / 나생문), flat-layout bare imports
  # + durable: AX durable-execution wrapper (멱등 재시도 + 체크포인트, 2026-05-30)
  "agent_models", "client", "dispatch", "prometheus", "naesengmoon", "fake_anthropic",
  "durable",
  # engine/harness — 3계층/4축 진단 엔진 (2026-05-28), flat-layout bare imports
  "harness", "harness_models",
  # engine/eureka bare module referenced by kg_local coupling-contract test (2026-05-28)
  "formal_context_builder",
  # engine/code_to_kg — tree-sitter source→KG (POC 2, 2026-05-29), flat-layout bare imports
  "ts_extractor", "kg_writer", "enrich",
]

# python-frontmatter PyPI package exposes `frontmatter` module name (PEP 503 name mismatch).
[tool.deptry.package_module_name_map]
python-frontmatter = "frontmatter"
python-igraph = "igraph"
sentence-transformers = "sentence_transformers"
hnswlib = "hnswlib"

# Optional/extra deps used via importorskip or conditional import (test-only or feature-gated).
# These do exist in pyproject [project.optional-dependencies] but deptry's default scan flags them.
[tool.deptry.per_rule_ignores]
# DEP001 = "module imported but not in deps" — false positives for optional/conditional imports
DEP001 = ["sentence_transformers", "hnswlib", "testcontainers",
          # fastmcp removed from ignore 2026-06-08 — now a declared [mcp] extra (engine.mcp_server)
          "tree_sitter", "tree_sitter_python", "jedi",  # optional AST adapter + LSP enrich ([code_to_kg] extra, graceful import)
          "opentelemetry", # wave12 — optional [otel] dep, guarded try/except in otel_channel.py
          "anthropic",     # 2026-05-28 — optional [agents] dep, lazy import in engine/agents/client.py
          "prov", "rdflib", "lxml",  # 2026-05-30 — optional [provexport] extra, lazy import in engine/provexport
          "libcst",  # 2026-05-31 — optional [hades-cst] extra, lazy import in extract_superclass_cst
          "leidenalg", "igraph",  # 2026-05-31 — optional [eureka-leiden] extra, lazy import in leiden_true operator
          "dbos",  # 2026-06-27 — optional durable_run backend; absent => in-process fallback
          "ooptdd", "ooptdd_loop",  # 2026-06-26 — dev-only methodology siblings (private, not on index);
                                    # importorskip'd in engine/**/test_*_ooptdd.py, no package-extra declaration
         ]
# DEP003 = "imported but transitive" — opentelemetry-api arrives via the declared [otel]
# opentelemetry-sdk (we never declare -api directly); the import is guarded try/except in otel_channel.
DEP003 = ["opentelemetry",
          # ooptdd/ooptdd_loop: dev-only siblings, editable-installed (so deptry sees them as
          # transitive locally) but not declared; absent on CI → DEP001. Ignored under both.
          "ooptdd", "ooptdd_loop"]
# DEP002 = "declared but not used in code" — packaging/CI/lint tools + placeholders
DEP002 = [
  "bhgman_tool",      # self-referential [all] extra = union of feature extras (metadata, not a code import)
  "pytest-cov",       # CI workflow (.github/workflows/pytest.yml)
  "ruff",             # uvx-invoked lint tool (no Python import)
  "mypy",             # uvx-invoked type checker (no Python import)
  "deptry",           # CI dependency drift checker (no Python import)
  "build",            # PEP 517 packaging frontend
  "twine",            # PyPI upload tool
  "pytest-asyncio",   # pytest plugin (registered via marker, no import)
  "fakeredis",        # importorskip in engine/gate/tests/test_gate.py
  "structlog",        # placeholder for engine/gate audit log (TODO in gate_endpoint.py:237)
  "cryptography",     # [verdict-asym] opt-in OQ1c AsymmetricVerdictGate (Ed25519), lazy import
  "pre-commit",       # wave11 — local 4-ratchet gate (uvx-invoked, no Python import)
  "opentelemetry-sdk",          # wave12 [otel] — importorskip in test_otel_channel.py
  "opentelemetry-exporter-otlp",# wave12 [otel] — runtime OTLP export, host-configured (no direct import)
  "lxml",             # 2026-05-30 [provexport] — prov serializer registry eager-loads provxml, no direct import
  "libcst",           # 2026-05-31 [hades-cst] — lazy import inside extract_superclass_cst (importorskip in tests)
  "leidenalg",        # 2026-05-31 [eureka-leiden] — lazy import inside induce_leiden_true (importorskip in tests)
  "python-igraph",    # 2026-05-31 [eureka-leiden] — igraph, lazy import inside induce_leiden_true
]

[tool.pytest.ini_options]
testpaths = ["engine", "worked", "verification"]
python_files = "test_*.py"
markers = [
    "apt_invariant: marks test as an APT methodology invariant (auto-recorded as :TestRunResult per cycle-bhgman-apt-completeness-remediation-2026-05-25 WQI F7). Usage: @pytest.mark.apt_invariant(rule='SA→SP→ST→SCW gate chain') on tests that defend an APT phase contract.",
]
