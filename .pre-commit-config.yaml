# bhgman_tool pre-commit / pre-push 6-stage gate
# wave11 (2026-05-17): audit lesson 실천
# (lesson-bhgman-tool-quality-ratchet-drift-2026-05-17: "CI 단독 의존 anti-pattern")
#
# Install:
#   uvx pre-commit install --hook-type pre-commit --hook-type pre-push
# Manual run:
#   uvx pre-commit run --all-files
#   uvx pre-commit run --all-files --hook-stage pre-push

repos:
  # ============================================================
  # Stage 1: file-level standard hooks (pre-commit, fast)
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        exclude: ^(\.complexipy_cache/|dist/)
      - id: check-json
        stages: [pre-commit]
        exclude: ^(\.complexipy_cache/|dist/)
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=6000]

  # ============================================================
  # Stage 2: ruff lint + format (pre-commit, fast)
  # audit ratchet #1 — wave11 box check
  # ============================================================
  # ruff pin must move together with pyproject [dev] ruff== and ci.yml lint job (no skew).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        stages: [pre-commit]
        args: [--fix]
      - id: ruff-format
        stages: [pre-commit]

  # ============================================================
  # Stage 3: complexipy cognitive complexity ratchet (pre-commit)
  # audit ratchet #2 — wave11 box check
  # max=15 per pyproject.toml convention
  # ============================================================
  - repo: local
    hooks:
      - id: complexipy
        # 2026-07-15: flat `-mx 15`에서 ratchet으로 교체. 실측상 코드베이스에 위반이
        # 58건 있어 이 게이트는 한 번도 통과할 수 없었고, 모두를 --no-verify로 몰아
        # 잘 동작하던 나머지 게이트(ruff/mypy/기본검사)까지 함께 꺼버렸다.
        # 이제 기존 58건은 baseline에 동결하고 *신규·악화*만 차단한다.
        # 부채를 갚으면 `python tools/complexipy_ratchet.py --update`로 조인다.
        # SYMPOSIUM 정전(apt-cleanup SKILL)이 요구하는 "complexipy --ratchet"의 실체
        # — complexipy엔 해당 플래그가 없다(정전↔도구 drift 해소).
        name: complexipy ratchet (신규·악화만 차단, 기존 58건 동결)
        entry: python tools/complexipy_ratchet.py
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # ============================================================
  # Stage 3.5: mypy (static type gate, pre-commit)
  # Adopted 2026-05-31 — mypy was a declared dev dep but never configured/wired;
  # the gate was unblocked once flat-layout imports → engine.* and the duplicate
  # path-injection conftests were removed. Config + scope live in [tool.mypy].
  # ============================================================
  - repo: local
    hooks:
      - id: mypy
        name: mypy (static type gate)
        entry: uvx --with pydantic mypy==2.2.0  # pinned to match pyproject [dev] + CI (no skew)
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # ============================================================
  # Stage 4: deptry (unused/missing deps check, pre-commit)
  # audit ratchet #3 — wave11 box check
  # ============================================================
  - repo: local
    hooks:
      - id: deptry
        name: deptry (dependency drift check)
        entry: uvx deptry . --ignore-notebooks --extend-exclude 'engine/eureka|symposium-skills'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # ============================================================
  # Stage 5: pytest (pre-commit, fast — single invocation).
  # The former two-invocation split worked around a sibling sys.modules
  # collision (engine/longinus_drift_audit + engine/longinus_l8_induction both
  # shipped a flat-layout models.py). Fixed 2026-05-25 by renaming the l8 copy
  # to induction_models.py (Naesengmoon ensemble finding #1), so a single root
  # pytest now collects both flat-layout packages cleanly.
  # ============================================================
  - repo: local
    hooks:
      - id: pytest
        name: pytest (engine + worked, single invocation)
        entry: bash -c 'source .venv/bin/activate && pytest --tb=line -q'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # Stage 6 (lychee link check) removed from pre-push 2026-06-02: broken on macOS —
  # lychee ships no prebuilt darwin binary, so the rev guard rejects patch tags and
  # cargo-binstall fails to build (`--install-path` unsupported). Both local sessions
  # had to --no-verify every push. Link-checking is fully covered in CI
  # (.github/workflows/lychee.yml, runs on push to main + PRs). No coverage lost.

  # ============================================================
  # Stage 7: audit_grep_coverage — GrepPatternCatalog v1 enforcement (pre-push)
  # naesengmoon cycle 2 C3-residual HIGH (defense in depth layer A)
  # ============================================================
  # KG: grep-pattern-catalog-v1-2026-05-20, lesson-audit-grep-coverage-drift-2026-05-20
  - repo: local
    hooks:
      - id: audit_grep_coverage
        name: audit_grep_coverage (catalog v1 file-coverage ≥ 5%)
        entry: bash bin/audit_grep_coverage.sh engine
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # ============================================================
  # Stage 8: count-claim drift guard (pre-push)
  # README/docs count claims (lean theorems, sorry, pytest) must match reality.
  # Hard-gates the deterministic lean counts (the metric that actually rotted
  # 50→71); soft-bands the growing pytest counts (fail only on over-claim).
  # ============================================================
  # KG: count-claim-drift-guard-2026-05-31 (ADRs/count-claim-drift-guard-2026-05-31.md)
  - repo: local
    hooks:
      - id: count_claim_guard
        name: count-claim drift guard (lean exact / pytest over-claim)
        entry: bash -c 'source .venv/bin/activate && python verification/check_count_claims.py'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
