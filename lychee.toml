# lychee config for bhgman_tool markdown link check
# Wave 7 P2-B absorption from SYMPOSIUM lychee.toml (2026-05-14)
# KG: span-bhgman-cicd-absorption-wave7-2026-05-14

cache = true
max_cache_age = "1d"

# Skip private/research data dirs (none currently — keep minimal exclude list)
exclude_path = [
  ".git",
  ".venv",
  "node_modules",
  "__pycache__",
  # Don't scan this config file itself
  "lychee.toml",
  # External clones if any added later
  "GIT",
  # Cross-repo symlink-mirror dirs — not link-checked in a standalone CI checkout.
  # theory/  → symlinks into PRIVATE gj3447/SYMPOSIUM (../../../SYMPOSIUM/THEORY/...)
  # skills/  → symlinks into the symposium-skills submodule (separate repo; its docs
  #            carry their own THEORY//MIND/.agents cross-repo links we don't own)
  # symposium-skills → the submodule path itself
  # First-party engineering docs (docs/, README*, engine/, lean/) stay audited.
  "theory",
  "skills",
  "symposium-skills",
]

# Skip dev-internal but keep file:// (local relative links must be checked)
# Known-flaky external URLs that move/return non-200 frequently
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://100\\.64\\.",
  # Anthropic blog/news posts move frequently
  "^https?://www\\.anthropic\\.com/news/",
  # arxiv often returns 403 from automated clients
  "^https?://arxiv\\.org/abs/",
  # GitHub API rate limits + private repo URLs cause transient 401/404
  "^https?://api\\.github\\.com/",
  # Substack/Medium return 403 to bots
  "^https?://[^/]+\\.substack\\.com/",
  "^https?://medium\\.com/",
  # Shell-variable interpolation patterns in install scripts (literal ${VAR})
  "\\$%7B",
  "\\$\\{",
  # Lean/Hurkens canonical mirrors that 404 on bot UA
  "^https?://leanprover\\.github\\.io/theorem_proving_in_lean4/",
  "^https?://www\\.cs\\.ru\\.nl/",
  # ResearchProvider / deepresearch external service
  "^https?://www\\.deepresearch\\.wiki/",
  # git-cliff-auto-generated CHANGELOG.md commit-SHA fragments (40-char hex anchor).
  # GitHub web view 에서는 자동 해석되지만 lychee 로컬 측은 anchor 미감지 → strict mode 회피.
  "CHANGELOG\\.md#[0-9a-f]{40}$",
  # Cross-repo pointers from docs/ into the PRIVATE gj3447/SYMPOSIUM sibling repo
  # (paper/theory layer, separate from this tool repo). Valid by design on the
  # author's multi-repo machine; unresolvable in a standalone CI checkout.
  # Covers both ../../../SYMPOSIUM/THEORY/... links and ../../theory/* symlink targets.
  "SYMPOSIUM/THEORY",
  "/theory/",
  # Link targets into the cross-repo mirror dirs (see exclude_path above): skills/
  # symlinks → symposium-skills submodule, THEORY/ + MIND/ → author's other repos.
  "/skills/",
  "/THEORY/",
  "/MIND/",
  # The SYMPOSIUM paper repo (gj3447/symposium) is PRIVATE — anonymous lychee in CI
  # gets 404. Transferred from gira-airobotics→gj3447 (2026-05-27); both excluded.
  "^https?://github\\.com/(gj3447|gira-airobotics)/symposium",
]

# Markdown fragment validation (anchor links): intentionally omitted.
# The `include_fragments` key's value type oscillates across lychee versions
# (boolean true/false vs string "full"/"none"), and lychee-action@v2 bundles a
# floating binary — so no single literal satisfies whatever build CI pulls. The
# key was *never* parsing successfully in CI (config load failed at this line on
# every run). Omitting it = lychee default, version-agnostic. Re-add only if the
# action's bundled lychee version is also pinned to a matching schema.

# Throttle (per host, ms)
max_concurrency = 16
timeout = 20

# Retry transient failures
max_retries = 2
retry_wait_time = 1

# Methods
method = "get"

# Accept transient 4xx/5xx that don't indicate broken links
accept = ["200..=299", "401", "403", "429", "500", "502", "503", "504"]
