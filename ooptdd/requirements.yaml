# bhgman_tool Longinus drift-audit — ooptdd-loop spec (the RED artifact, written first).
#
# Two trace gates, each Longinus-bound to a REAL emitting symbol in ooptdd/adapter.py.
# The adapter ships these events only by genuinely running engine.longinus_drift_audit code
# (sha256_baseline.init_baseline + LonginusAudit.run_full). A gate goes DONE iff it is GREEN
# *and* its bound symbol's body literally contains the must_emit event string (AST-checked).
#
# Run:   ooptdd-loop validate-spec ooptdd/requirements.yaml
#        ooptdd-loop run          ooptdd/requirements.yaml --json
name: bhgman-longinus-audit

target:
  mode: in_process
  callable: ooptdd.adapter:run_audit_pipeline   # called as run_audit_pipeline(backend, cid)
  backend: memory                               # zero-infra in-process store
  root: .                                       # repo root: source root for Longinus + import

requirements:
  - id: REQ-AUDIT-RAN
    description: the real Longinus drift audit runs exactly once per cycle
    gate:
      - {event: longinus_audit_complete, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-longinus-adapter-20260624
      source: ooptdd/adapter.py
      symbol: run_audit_pipeline
      must_emit: longinus_audit_complete

  - id: REQ-SHA256-BASELINE
    description: at least one real sha256 baseline is earned + checked off disk
    gate:
      - {event: sha256_baseline_checked, op: ">=", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-longinus-adapter-20260624
      source: ooptdd/adapter.py
      symbol: emit_sha256_phase
      must_emit: sha256_baseline_checked
