# bhgman_tool legion dispatch 폐루프(G5-C5 소비자) — ooptdd-loop spec.
#
# Five trace gates, each Longinus-bound to a REAL emitting symbol in
# ooptdd/legion_dispatch_adapter.py. The adapter ships events only by genuinely running
# seed(확신-dup 12그룹) -> build_default_legion().run()(발화) -> consume_dispatch(실행,
# σ게이트 상속 write) -> 재run(재발화 실측). Counts are RE-DERIVED from the KG state
# (consumed_at 보유 :DispatchEvent) and the DispatchConsumeReport — the literals live in
# the ADAPTER, never in engine/legion/ (the engine stays emit-free).
#
# LakatosTree_BhgmanDispatchLoop_20260710: dispatch decisions had NO consumer (07-09
# deep-pass, proven by the code itself) — this spec is the trace receipt of the first
# consumer, the loop's first closure.
#
# Run:   ooptdd-loop validate-spec ooptdd/legion_dispatch_requirements.yaml
#        ooptdd-loop run          ooptdd/legion_dispatch_requirements.yaml --json
name: bhgman-legion-dispatch-consume

target:
  mode: in_process
  callable: ooptdd.legion_dispatch_adapter:run_legion_dispatch_pipeline
  backend: memory
  root: .

requirements:
  - id: REQ-LDC-CONSUME-RAN
    description: the real consume pass runs exactly once per cycle, in apply mode
    gate:
      - {event: dispatch_consume_completed, where: {dry_run: false}, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-legion-dispatch-adapter-20260710
      source: ooptdd/legion_dispatch_adapter.py
      symbol: run_legion_dispatch_pipeline
      must_emit: dispatch_consume_completed

  - id: REQ-LDC-FIRED
    description: the seeded backlog(12>10) really fires the occam self-dispatch (exactly 1)
    gate:
      - {event: dispatch_decision_fired, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-legion-dispatch-adapter-20260710
      source: ooptdd/legion_dispatch_adapter.py
      symbol: emit_fired_phase
      must_emit: dispatch_decision_fired

  - id: REQ-LDC-CONSUMED-KG
    description: consumption is KG-observable — consumed_at events re-derived from the store (>=1)
    gate:
      - {event: dispatch_decision_consumed, op: ">=", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-legion-dispatch-adapter-20260710
      source: ooptdd/legion_dispatch_adapter.py
      symbol: emit_consumed_phase
      must_emit: dispatch_decision_consumed

  - id: REQ-LDC-EXECUTED
    description: the allowlist edge (occam janitor) actually executed (>=1)
    gate:
      - {event: dispatch_janitor_executed, op: ">=", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-legion-dispatch-adapter-20260710
      source: ooptdd/legion_dispatch_adapter.py
      symbol: emit_executed_phase
      must_emit: dispatch_janitor_executed

  - id: REQ-LDC-SELF-HEAL
    description: the janitor clears its own trigger — no refire on the second run (exactly 1)
    gate:
      - {event: dispatch_trigger_cleared, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-legion-dispatch-adapter-20260710
      source: ooptdd/legion_dispatch_adapter.py
      symbol: emit_self_heal_phase
      must_emit: dispatch_trigger_cleared
