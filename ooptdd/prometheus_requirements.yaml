# bhgman_tool prometheus 획득(acquire) — ooptdd-loop spec (the RED artifact, written first).
#
# Four trace gates, each Longinus-bound to a REAL emitting symbol in
# ooptdd/prometheus_adapter.py. The adapter ships these events only by genuinely running
# engine.prometheus.run_acquire (gap-detect -> query-derive -> fetch -> parse -> ingest).
# A gate goes DONE iff it is GREEN *and* its bound symbol's body literally contains the
# must_emit event string (AST-checked) — the literals live in the ADAPTER, never in
# engine/prometheus/ (the engine stays key-free / I/O-free / emit-free).
#
# Run:   ooptdd-loop validate-spec ooptdd/prometheus_requirements.yaml
#        ooptdd-loop run          ooptdd/prometheus_requirements.yaml --json
name: bhgman-prometheus-acquire

target:
  mode: in_process
  callable: ooptdd.prometheus_adapter:run_prometheus_pipeline  # run_prometheus_pipeline(backend, cid)
  backend: memory                                              # zero-infra in-process store
  root: .                                                      # repo root: Longinus source + import

requirements:
  - id: REQ-PROM-ACQUIRE-RAN
    description: the real prometheus acquire runs exactly once per cycle
    gate:
      - {event: prometheus_acquire_completed, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-prometheus-adapter-20260624
      source: ooptdd/prometheus_adapter.py
      symbol: run_prometheus_pipeline
      must_emit: prometheus_acquire_completed

  - id: REQ-PROM-GAP-DETECTED
    description: the real gap-detect surfaces the OpenQuestion gap off the scan
    gate:
      - {event: prometheus_gap_detected, where: {kind: OpenQuestion}, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-prometheus-adapter-20260624
      source: ooptdd/prometheus_adapter.py
      symbol: emit_gap_phase
      must_emit: prometheus_gap_detected

  - id: REQ-PROM-FINDING-EXTRACTED
    description: exactly the findings the real fetch->parse chain produced arrive (2)
    gate:
      - {event: prometheus_finding_extracted, op: "==", count: 2}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-prometheus-adapter-20260624
      source: ooptdd/prometheus_adapter.py
      symbol: emit_extract_phase
      must_emit: prometheus_finding_extracted

  - id: REQ-PROM-FINDING-INGESTED
    description: exactly the findings really written via write_cypher arrive (apply wing, 2)
    gate:
      - {event: prometheus_finding_ingested, op: "==", count: 2}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-prometheus-adapter-20260624
      source: ooptdd/prometheus_adapter.py
      symbol: emit_ingest_phase
      must_emit: prometheus_finding_ingested
