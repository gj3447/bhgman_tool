# bhgman_tool eureka 창조(abstraction synthesis) — ooptdd-loop spec (the RED artifact).
#
# Four trace gates, each Longinus-bound to a REAL emitting symbol in ooptdd/eureka_adapter.py.
# The adapter ships these events only by genuinely running engine.eureka.run_from_kg (FCA
# induce -> quality gate -> naesengmoon gate -> persist). Counts are RE-DERIVED from the real
# PipelineRun stage payloads (concepts / survivors / persisted) — NEVER from stages_ok, which
# is nonzero even on an empty KG (the fake-green trap). A gate goes DONE iff GREEN *and* its
# bound symbol's body literally contains the must_emit string. Literals live in the ADAPTER,
# never in engine/eureka/ (the engine records into a pure PipelineRun, no ship machinery).
#
# Run:   ooptdd-loop validate-spec ooptdd/eureka_requirements.yaml
#        ooptdd-loop run          ooptdd/eureka_requirements.yaml --json
name: bhgman-eureka-induction

target:
  mode: in_process
  callable: ooptdd.eureka_adapter:run_eureka_pipeline  # run_eureka_pipeline(backend, cid)
  backend: memory
  root: .

requirements:
  - id: REQ-EUR-CYCLE-RAN
    description: the real eureka induction cycle runs exactly once
    gate:
      - {event: eureka_cycle_complete, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-eureka-adapter-20260625
      source: ooptdd/eureka_adapter.py
      symbol: run_eureka_pipeline
      must_emit: eureka_cycle_complete

  - id: REQ-EUR-CONCEPTS-INDUCED
    description: exactly the AbstractClasses the real FCA induction produced arrive (2)
    gate:
      - {event: eureka_concepts_induced, op: "==", count: 2}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-eureka-adapter-20260625
      source: ooptdd/eureka_adapter.py
      symbol: emit_induction_phase
      must_emit: eureka_concepts_induced

  - id: REQ-EUR-QUALITY-SURVIVOR
    description: exactly the concepts clearing the FCA_STABILITY_MIN floor arrive (2)
    gate:
      - {event: eureka_quality_survivor, op: "==", count: 2}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-eureka-adapter-20260625
      source: ooptdd/eureka_adapter.py
      symbol: emit_induction_phase
      must_emit: eureka_quality_survivor

  - id: REQ-EUR-ABSTRACTION-PERSISTED
    description: exactly the AbstractClasses really persisted ACCEPTED by stage_6_persist (2)
    gate:
      - {event: eureka_abstraction_persisted, where: {verdictStatus: ACCEPTED}, op: "==", count: 2}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-eureka-adapter-20260625
      source: ooptdd/eureka_adapter.py
      symbol: emit_persist_phase
      must_emit: eureka_abstraction_persisted
