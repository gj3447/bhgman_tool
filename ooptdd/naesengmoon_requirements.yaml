# bhgman_tool naesengmoon 검증(verdict) — ooptdd-loop spec (the RED artifact).
#
# Four trace gates, each Longinus-bound to a REAL emitting symbol in
# ooptdd/naesengmoon_adapter.py. The adapter ships these events only by genuinely running the
# four upstream engines (EARN upstream_present), a real decorrelation aggregate (n_oracle), and
# the real `verify('lean-goals', lean/SeedLifecycle.lean)` Lean subprocess (the territory floor).
# Literals live in the ADAPTER, never in engine/naesengmoon/. A gate goes DONE iff GREEN *and*
# its bound symbol's body literally contains the must_emit string.
#
# NOTE: REQ-NM-ORACLE-FLOOR is the only territory-grade leg (independent `lean` exit); the
# upstream/ensemble counts are single-authority and charged honestly.
#
# Run:   ooptdd-loop validate-spec ooptdd/naesengmoon_requirements.yaml
#        ooptdd-loop run          ooptdd/naesengmoon_requirements.yaml --json
name: bhgman-naesengmoon-verdict

target:
  mode: in_process
  callable: ooptdd.naesengmoon_adapter:run_naesengmoon_pipeline  # (backend, cid)
  backend: memory
  root: .

requirements:
  - id: REQ-NM-VERDICT-COMPLETE
    description: the real naesengmoon verdict runs exactly once
    gate:
      - {event: naesengmoon_verdict_complete, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-naesengmoon-adapter-20260625
      source: ooptdd/naesengmoon_adapter.py
      symbol: run_naesengmoon_pipeline
      must_emit: naesengmoon_verdict_complete

  - id: REQ-NM-UPSTREAM-PRESENT
    description: all four upstream provides are EARNED from real engines (4)
    gate:
      - {event: naesengmoon_upstream_present, op: "==", count: 4}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-naesengmoon-adapter-20260625
      source: ooptdd/naesengmoon_adapter.py
      symbol: emit_upstream_phase
      must_emit: naesengmoon_upstream_present

  - id: REQ-NM-ENSEMBLE-AGGREGATED
    description: a real oracle ensemble is aggregated over the ORACLE critics (2)
    gate:
      - {event: naesengmoon_ensemble_aggregated, op: "==", count: 2}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-naesengmoon-adapter-20260625
      source: ooptdd/naesengmoon_adapter.py
      symbol: emit_ensemble_phase
      must_emit: naesengmoon_ensemble_aggregated

  - id: REQ-NM-ORACLE-FLOOR
    description: the substrate-disjoint Lean floor passes (territory-grade, exit 0)
    gate:
      - {event: naesengmoon_oracle_verified, where: {passed: true}, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-naesengmoon-adapter-20260625
      source: ooptdd/naesengmoon_adapter.py
      symbol: emit_oracle_floor_phase
      must_emit: naesengmoon_oracle_verified
