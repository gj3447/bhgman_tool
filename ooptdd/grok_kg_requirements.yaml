# ooptdd-loop spec — opt-in verification of a LIVE Grok KG MCP endpoint (SSE).
# The capability URL is secret runtime configuration and MUST NOT be committed. Importing the
# adapter or running normal CI does no network or KG work. An operator must explicitly provide:
#   BHGMAN_GROK_KG_LIVE_WRITE_PROBE=1
#   BHGMAN_GROK_KG_MCP_SSE_URL='https://host.example/<capability>/'
# Each gate is Longinus-bound to a REAL event-emitting literal in run_grok_kg_probe, which ships
# that event ONLY when the corresponding behaviour is observed. The write-roundtrip gate requires
# CREATE=1, read-back=1, DELETE=1, and a post-cleanup residue count of zero.
#
# Run:   ooptdd-loop validate-spec ooptdd/grok_kg_requirements.yaml
#        ooptdd-loop run          ooptdd/grok_kg_requirements.yaml --json
name: grok-kg-endpoint

target:
  mode: in_process
  callable: ooptdd.grok_kg_endpoint_adapter:run_grok_kg_probe
  backend: memory
  root: .

requirements:
  - id: REQ-HTTPS-NO-DOWNGRADE
    description: slash-less capability path returns HTTPS 200, never a 307 -> http:// downgrade
    gate:
      - {event: grok_https_no_downgrade, op: "==", count: 1}
    longinus:
      kg_anchor: finding-grok-kg-mcp-endpoint-ooptdd-20260713
      source: ooptdd/grok_kg_endpoint_adapter.py
      symbol: run_grok_kg_probe
      must_emit: grok_https_no_downgrade

  - id: REQ-SSE-INIT
    description: real SSE handshake + MCP initialize succeed (serverInfo present)
    gate:
      - {event: grok_sse_initialized, op: "==", count: 1}
    longinus:
      kg_anchor: finding-grok-kg-mcp-endpoint-ooptdd-20260713
      source: ooptdd/grok_kg_endpoint_adapter.py
      symbol: run_grok_kg_probe
      must_emit: grok_sse_initialized

  - id: REQ-TOOLS-READWRITE
    description: tools/list exposes read_neo4j_cypher AND write_neo4j_cypher (read+write parity)
    gate:
      - {event: grok_tools_readwrite, op: "==", count: 1}
    longinus:
      kg_anchor: finding-grok-kg-mcp-endpoint-ooptdd-20260713
      source: ooptdd/grok_kg_endpoint_adapter.py
      symbol: run_grok_kg_probe
      must_emit: grok_tools_readwrite

  - id: REQ-KG-READ
    description: an explicitly enabled real read_neo4j_cypher returns a live node count > 0
    gate:
      - {event: grok_kg_read_ok, op: "==", count: 1}
    longinus:
      kg_anchor: finding-grok-kg-mcp-endpoint-ooptdd-20260713
      source: ooptdd/grok_kg_endpoint_adapter.py
      symbol: run_grok_kg_probe
      must_emit: grok_kg_read_ok

  - id: REQ-KG-WRITE-ROUNDTRIP
    description: parameterized CREATE -> read-back(==1) -> finally DELETE -> residue(==0)
    gate:
      - {event: grok_kg_write_roundtrip, op: "==", count: 1}
    longinus:
      kg_anchor: finding-grok-kg-mcp-endpoint-ooptdd-20260713
      source: ooptdd/grok_kg_endpoint_adapter.py
      symbol: run_grok_kg_probe
      must_emit: grok_kg_write_roundtrip
