# bhgman_tool jaebaeman 출격(sortie) — ooptdd-loop spec (the RED artifact, written first).
#
# Five trace gates, each Longinus-bound to a REAL emitting symbol in
# ooptdd/jaebaeman_adapter.py. The adapter ships these events only by genuinely running
# the engine chain plant_seeds (MERGE-only covenant) -> read_ready_seeds (store join) ->
# drive_seeds (COLLECTED status writes). A gate goes DONE iff it is GREEN *and* its bound
# symbol's body literally contains the must_emit event string (AST-checked) — the
# literals live in the ADAPTER, never in engine/jaebaeman/ (the engine stays key-free /
# I/O-free / emit-free).
#
# jbm-s1 (LakatosTree_BhgmanJaebaeman_20260702): jaebaeman was the SOLE commander of 7
# without an adapter (audit wf_376c327b-8f3 G1) — this spec closes that receipt gap.
#
# Run:   ooptdd-loop validate-spec ooptdd/jaebaeman_requirements.yaml
#        ooptdd-loop run          ooptdd/jaebaeman_requirements.yaml --json
name: bhgman-jaebaeman-sortie

target:
  mode: in_process
  callable: ooptdd.jaebaeman_adapter:run_jaebaeman_pipeline  # run_jaebaeman_pipeline(backend, cid)
  backend: memory                                            # zero-infra in-process store
  root: .                                                    # repo root: Longinus source + import

requirements:
  - id: REQ-JBM-SORTIE-RAN
    description: the real jaebaeman sortie runs exactly once per cycle, in apply mode
    gate:
      - {event: jaebaeman_sortie_completed, where: {dry_run: false}, op: "==", count: 1}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-jaebaeman-adapter-20260702
      source: ooptdd/jaebaeman_adapter.py
      symbol: run_jaebaeman_pipeline
      must_emit: jaebaeman_sortie_completed

  - id: REQ-JBM-SEED-PLANTED
    description: exactly the seed PKs the real plant_seeds landed in the store arrive (3)
    gate:
      - {event: jaebaeman_seed_planted, op: "==", count: 3}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-jaebaeman-adapter-20260702
      source: ooptdd/jaebaeman_adapter.py
      symbol: emit_plant_phase
      must_emit: jaebaeman_seed_planted

  - id: REQ-JBM-SEED-READY
    description: exactly the seeds the real read_ready_seeds joined back out of the store (3)
    gate:
      - {event: jaebaeman_seed_ready, op: "==", count: 3}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-jaebaeman-adapter-20260702
      source: ooptdd/jaebaeman_adapter.py
      symbol: emit_ready_phase
      must_emit: jaebaeman_seed_ready

  - id: REQ-JBM-SEED-GERMINATED
    description: exactly the seeds whose applied COLLECTED status write landed at the store (3)
    gate:
      - {event: jaebaeman_seed_germinated, where: {status: COLLECTED}, op: "==", count: 3}
    longinus:
      kg_anchor: finding-ooptdd-bhgman-jaebaeman-adapter-20260702
      source: ooptdd/jaebaeman_adapter.py
      symbol: emit_germinate_phase
      must_emit: jaebaeman_seed_germinated

  - id: REQ-JBM-LIFECYCLE-ORDER
    description: the sortie lifecycle emits in PLANTED -> READY -> GERMINATED order (novel axis)
    gate:
      - must_order: [jaebaeman_sortie_started, jaebaeman_seed_planted, jaebaeman_seed_ready, jaebaeman_seed_germinated, jaebaeman_sortie_completed]
        within_s: 60
    longinus:
      kg_anchor: finding-ooptdd-bhgman-jaebaeman-adapter-20260702
      source: ooptdd/jaebaeman_adapter.py
      symbol: run_jaebaeman_pipeline
      must_emit: jaebaeman_sortie_started
