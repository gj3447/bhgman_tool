# The Red artifact for bhgman_tool's Longinus drift-audit flow.
#
# Written as the EXPECTATION before trusting any return value: it states what the
# store must OBSERVE when LonginusAudit.run_full() drives a real sha256 baseline +
# verify over seeded ReferenceSites. The store is the judge — a green return value
# that silently never reached the store is exactly what this gate exists to catch.
#
# Thresholds below are not invented: they match the REAL AuditReport the engine
# emits for the test fixture (2 sites baselined, 1 genuine SHA256_MISMATCH after a
# disk mutation, a dirty/non-clean verdict). See test_drift_audit_ooptdd.py.
#
# Strength: every gating check pins a field (present/where + count/where),
# orders the lifecycle (must_order), or forbids errors (absent wing) — no
# existence-only check survives the VAC vacuity audit.
cid_env: OOPTDD_CID
service: bhgman.longinus

expect:
  # ── cardinality, value-pinned (not existence-only) ───────────────────────
  # exactly one audit run, identified by the real audit_id field.
  - event: audit.started
    where: {phase: scan}
    op: "=="
    count: 1

  # one site.baselined per ReferenceSite that got a sha256 baseline (== 2 here),
  # scoped to the repo_tag the audit ran under — a wrong repo_tag fails the gate.
  - event: site.baselined
    where: {repo_tag: bhgman}
    op: "=="
    count: 2

  # exactly the sha256 drifts the verify phase truly found (1 SHA256_MISMATCH).
  - event: drift.detected
    where: {kind: SHA256_MISMATCH}
    op: "=="
    count: 1

  # the audit closed with a dirty verdict (is_clean is False) and the real
  # total_drifts it computed. A clean/forgotten close fails this.
  - event: audit.completed
    where: {verdict: dirty}
    op: "=="
    count: 1

  # ── subset present, value-pinned via where: (any order) ──────────────────
  - present:
      - {event: audit.started, where: {phase: scan}}
      - {event: drift.detected, where: {kind: SHA256_MISMATCH}}
      - {event: audit.completed, where: {verdict: dirty}}

  # ── sequencing: the flow must emit in lifecycle order ────────────────────
  - must_order: [audit.started, site.baselined, drift.detected, audit.completed]
    within_s: 60

  # ── negative wing: the happy drift-audit flow logs no ERROR ───────────────
  - absent:
      where: {level: ERROR}
