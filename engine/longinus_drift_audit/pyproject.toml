[project]
name = "longinus-drift-audit"
version = "0.2.0"
description = "Longinus methodology v3.3 — 7-Layer Reference Model + BX Lens Laws + 5 drift detector + GED + Reverse Orphan Scan + sha256 baseline + Forward Orphan Scan (Wave 6 absorbed 2026-05-14)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "neo4j>=5.20.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0"]  # hypothesis: property-based tests (test_delta_lens_properties.py)
# OTel GenAI-semconv dispatch trace channel (otel_channel.py). Graceful no-op when absent.
otel = ["opentelemetry-sdk>=1.20"]

[project.scripts]
longinus-audit = "audit_runner:main"
bhgman-daemon = "daemon_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Must list every top-level *.py module (except __init__) or a non-editable wheel
# build silently drops the unlisted ones. Kept complete + sorted; enforced by
# tests/test_pyproject_modules_complete.py so it can't drift again.
py-modules = [
  "audit_runner",
  "bx_lens",
  "code_scanner",
  "daemon",
  "daemon_cli",
  "delta_category_registry",
  "delta_lens",
  "dispatch_audit",
  "dispatch_eval",
  "drift_detector",
  "dynamic_dispatch_probe",
  "edit_lens_line_range",
  "embedding_channel",
  "forward_binding_materialize",
  "forward_orphan_scan",
  "ged_metric",
  "intoto_channel",
  "kg_binding_categories",
  "kg_binding_delta",
  "kg_binding_delta_lens",
  "kg_binding_lenses",
  "kg_binding_registry_install",
  "kg_binding_state",
  "kg_client",
  "models",
  "otel_channel",
  "profunctor_api",
  "prov_channel",
  "reference_layers",
  "refresh_drifted_baselines",
  "reverse_orphan_scan",
  "scip_adapter",
  "sha256_baseline",
  "signature_baseline",
  "tree_sitter_adapter",
  "urdna2015_channel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
