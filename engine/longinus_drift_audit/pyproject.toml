[project]
name = "longinus-drift-audit"
version = "0.2.0"
description = "Longinus methodology v3.3 — 7-Layer Reference Model + BX Lens Laws + 5 drift detector + GED + Reverse Orphan Scan + sha256 baseline + Forward Orphan Scan (Wave 6 absorbed 2026-05-14)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "neo4j>=5.20.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# OTel GenAI-semconv dispatch trace channel (otel_channel.py). Graceful no-op when absent.
otel = ["opentelemetry-sdk>=1.20"]

[project.scripts]
longinus-audit = "audit_runner:main"
bhgman-daemon = "daemon_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "models",
  "kg_client",
  "code_scanner",
  "reference_layers",
  "bx_lens",
  "drift_detector",
  "ged_metric",
  "reverse_orphan_scan",
  "sha256_baseline",
  "forward_orphan_scan",
  "otel_channel",
  "dispatch_eval",
  "audit_runner",
  "daemon",
  "daemon_cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
