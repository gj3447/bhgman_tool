# The Red artifact for bhgman_tool's prometheus 획득(acquire) flow.
#
# Written as the EXPECTATION before trusting any return value: it states what the
# store must OBSERVE when engine.prometheus.run_acquire drives a real
# gap-detect -> query-derive -> fetch -> parse -> ingest chain over seeded gaps +
# a StaticFetcher corpus keyed to the EXACT derive_query() output. The store is the
# judge — a green AcquireReport that silently never reached the store is exactly
# what this gate exists to catch (see test_prometheus_ooptdd.py).
#
# Thresholds are not invented: they match the REAL AcquireReport the engine emits
# for the fixture (2 gaps = 1 OpenQuestion + 1 VerdictPending, 2 findings from the
# fetch->parse chain, 2 planned MERGE cyphers, 2 ingested in the apply wing,
# dry_run=False). A fresh/empty KG returns 0 gaps => 0 findings (STEP-0 baseline),
# so every ==N below is GENUINELY RED until the real chain populates the store.
#
# Strength: every gating check pins a field (where) or a cardinality (==), orders
# the lifecycle (must_order), or forbids errors (absent) — no existence-only check
# survives the VAC vacuity audit.
cid_env: OOPTDD_CID
service: bhgman.prometheus

expect:
  # ── cardinality, value-pinned (not existence-only) ───────────────────────
  # exactly one acquire run, identified by the real scan phase.
  - event: prometheus_acquire_started
    where: {phase: scan}
    op: "=="
    count: 1

  # one gap_detected per real Gap, value-pinned by kind: a fresh KG yields neither.
  - event: prometheus_gap_detected
    where: {kind: OpenQuestion}
    op: "=="
    count: 1
  - event: prometheus_gap_detected
    where: {kind: VerdictPending}
    op: "=="
    count: 1

  # exactly the findings the real fetch->parse chain produced (==2). Break one
  # corpus->derive_query join (drop-the-seed) and this collapses to 1 => RED.
  - event: prometheus_finding_extracted
    op: "=="
    count: 2

  # one finding_proposed per planned MERGE cypher (the PROPOSE covenant, ==2).
  - event: prometheus_finding_proposed
    op: "=="
    count: 2

  # one finding_ingested per REAL write_cypher row (apply wing, ==2). A dry-run
  # report has ingested=0 => no event => this is RED (the apply covenant).
  - event: prometheus_finding_ingested
    op: "=="
    count: 2

  # the acquire closed in apply mode (dry_run False). A forgotten/dry close fails.
  - event: prometheus_acquire_completed
    where: {dry_run: false}
    op: "=="
    count: 1

  # ── subset present, value-pinned via where (any order) ───────────────────
  - present:
      - {event: prometheus_acquire_started, where: {phase: scan}}
      - {event: prometheus_gap_detected, where: {kind: VerdictPending}}
      - {event: prometheus_acquire_completed, where: {dry_run: false}}

  # ── sequencing: the flow must emit in lifecycle order ────────────────────
  - must_order: [prometheus_acquire_started, prometheus_gap_detected, prometheus_finding_extracted, prometheus_finding_proposed, prometheus_finding_ingested, prometheus_acquire_completed]
    within_s: 60

  # ── negative wing: the happy acquire flow logs no ERROR ──────────────────
  - absent:
      where: {level: ERROR}
