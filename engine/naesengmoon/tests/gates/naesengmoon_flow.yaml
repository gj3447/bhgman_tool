# The Red artifact for bhgman_tool's naesengmoon 검증(verdict) flow.
#
# It states what the store must OBSERVE when the verdict gate runs: all four upstream provides
# are EARNED from real upstream engines, a real oracle ensemble is aggregated, and the
# substrate-disjoint Lean floor is run. Thresholds match the real run: upstream_present=4,
# n_oracle=2 (lean + occam-twins ORACLE critics), Lean floor passed (SeedLifecycle.lean, 8
# closed goals, exit 0).
#
# HONESTY: upstream_present and ensemble_aggregated are SINGLE-AUTHORITY (this adapter computing
# from its own runs); only naesengmoon_oracle_verified is corroborated by an independent
# substrate (the `lean` process exit). Point the Lean leg at a non-compiling target and the
# territory floor is honestly RED — it cannot be faked by an in-memory stub.
#
# Strength: value-pinned (where / ==), ordered (must_order), forbidding (absent).
cid_env: OOPTDD_CID
service: bhgman.naesengmoon

expect:
  # the verdict gate was entered (the 4-upstream contract opened the gate).
  - event: naesengmoon_verify_entered
    where: {phase: gate}
    op: "=="
    count: 1

  # one per upstream provides EARNED from a real engine (==4). Drop any one engine's seed and
  # this drops to 3 => RED. NOT hand-built {mode:'ok'} dicts.
  - event: naesengmoon_upstream_present
    op: "=="
    count: 4

  # one per ORACLE critic in the real decorrelation aggregate (==2). single-authority.
  - event: naesengmoon_ensemble_aggregated
    op: "=="
    count: 2

  # the substrate-disjoint Lean floor PASSED (==1, where passed:true) — the only territory-grade
  # leg. A non-compiling .lean is honestly passed:false => this is RED.
  - event: naesengmoon_oracle_verified
    where: {passed: true}
    op: "=="
    count: 1

  # the verdict closed exactly once.
  - event: naesengmoon_verdict_complete
    op: "=="
    count: 1

  # ── subset present, value-pinned via where (any order) ───────────────────
  - present:
      - {event: naesengmoon_verify_entered, where: {phase: gate}}
      - {event: naesengmoon_oracle_verified, where: {passed: true}}
      - {event: naesengmoon_verdict_complete}

  # ── sequencing: the flow must emit in lifecycle order ────────────────────
  - must_order: [naesengmoon_verify_entered, naesengmoon_upstream_present, naesengmoon_ensemble_aggregated, naesengmoon_oracle_verified, naesengmoon_verdict_complete]
    within_s: 300

  # ── negative wing: the happy verdict flow logs no ERROR ──────────────────
  - absent:
      where: {level: ERROR}
