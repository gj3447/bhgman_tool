# The Red artifact for bhgman_tool's eureka 창조(abstraction synthesis) flow.
#
# It states what the store must OBSERVE when engine.eureka.run_from_kg drives a real FCA
# induction -> quality gate -> naesengmoon gate -> persist over a seeded 8-object cluster.
# Thresholds match the REAL PipelineRun for the fixture: 2 concepts induced, 2 survive the
# FCA_STABILITY_MIN=0.50 floor, 2 persisted with verdictStatus=ACCEPTED (persist_accept=True).
#
# HONEST-COUNT NOTE: an EMPTY CypherRunner yields ZERO concepts yet the pipeline's stages_ok
# is STILL 5 (stage_1-extract etc. report ok=True over zero concepts) — so a gate bound to
# stages_ok would FAKE-GREEN on a garbage KG. This gate therefore pins ONLY the earned counts
# (concepts / survivors / persisted), each re-derived from the real PipelineRun stage payloads.
# Every ==N is GENUINELY RED on an empty/dropped seed.
#
# Strength: value-pinned (where / ==), ordered (must_order), forbidding (absent) — no
# existence-only check, and NO stages_ok pin.
cid_env: OOPTDD_CID
service: bhgman.eureka

expect:
  # exactly one cycle, in the induce phase.
  - event: eureka_cycle_started
    where: {phase: induce}
    op: "=="
    count: 1

  # one per AbstractClass the real FCA induction produced (==2). Empty context => 0 => RED
  # (and NOT stages_ok, which would be 5 on that same empty run).
  - event: eureka_concepts_induced
    op: "=="
    count: 2

  # one per concept clearing the FCA_STABILITY_MIN=0.50 floor (==2).
  - event: eureka_quality_survivor
    op: "=="
    count: 2

  # one per AbstractClass really persisted ACCEPTED by stage_6_persist (==2). A
  # VERDICT_PENDING (persist_accept=False) row would not match verdictStatus=ACCEPTED => RED.
  - event: eureka_abstraction_persisted
    where: {verdictStatus: ACCEPTED}
    op: "=="
    count: 2

  # the cycle closed exactly once.
  - event: eureka_cycle_complete
    op: "=="
    count: 1

  # ── subset present, value-pinned via where (any order) ───────────────────
  - present:
      - {event: eureka_cycle_started, where: {phase: induce}}
      - {event: eureka_abstraction_persisted, where: {verdictStatus: ACCEPTED}}
      - {event: eureka_cycle_complete}

  # ── sequencing: the flow must emit in lifecycle order ────────────────────
  - must_order: [eureka_cycle_started, eureka_concepts_induced, eureka_quality_survivor, eureka_abstraction_persisted, eureka_cycle_complete]
    within_s: 60

  # ── negative wing: the happy induction flow logs no ERROR ────────────────
  - absent:
      where: {level: ERROR}
