# The Red artifact for bhgman_tool's occam 정리(dedup/supersede) flow.
#
# It states what the store must OBSERVE when engine.occam.run_occam scans KG SourceCodeNode
# rows, detects a confident byte-identical SUPERSEDE candidate, and applies it. Thresholds
# match the REAL OccamRunResult for the fixture: 1 candidate detected (superseded_count), 1
# node superseded (apply_result.applied_count, APPLY wing), dry_run False.
#
# HONEST-COUNT NOTE: node.superseded is bound to apply_result.applied_count and emitted ONLY in
# the applied branch — a dry-run (PROPOSE) leaves applied_count=0 even though it plans the
# supersession, a clean KG yields zero candidates, and a write that matched no row applies
# nothing. Each leaves the ==1 counts GENUINELY RED. No count is taken from planned candidates.
#
# Strength: value-pinned (where / ==), ordered (must_order), forbidding (absent).
cid_env: OOPTDD_CID
service: bhgman.occam

expect:
  # exactly one occam run, in the scan phase.
  - event: occam.started
    where: {phase: scan}
    op: "=="
    count: 1

  # one per real supersession candidate detected (report.superseded_count). Clean KG => 0 => RED.
  - event: occam.candidate.detected
    op: "=="
    count: 1

  # one per node REALLY superseded by a matched write (apply_result.applied_count), under the
  # archive-only covenant. A dry-run / clean / unmatched-write leaves this 0 => RED.
  - event: occam.node.superseded
    where: {covenant: archive_only}
    op: "=="
    count: 1

  # the occam pass closed in apply mode (dry_run False). A PROPOSE/dry close fails this.
  - event: occam.completed
    where: {dry_run: false}
    op: "=="
    count: 1

  # ── subset present, value-pinned via where (any order) ───────────────────
  - present:
      - {event: occam.started, where: {phase: scan}}
      - {event: occam.node.superseded, where: {covenant: archive_only}}
      - {event: occam.completed, where: {dry_run: false}}

  # ── sequencing: the flow must emit in lifecycle order ────────────────────
  - must_order: [occam.started, occam.candidate.detected, occam.node.superseded, occam.completed]
    within_s: 60

  # ── negative wing: the happy occam flow logs no ERROR ────────────────────
  - absent:
      where: {level: ERROR}
