[project]
name = "longinus-l8-induction"
version = "0.1.0"
description = "Longinus L8 induction — Extract/Community/Summarize/Induce/Naesengmoon Gate/Hybrid retrieval/Drift loop. AbstractClass + GENERALIZES edge crystallization. CONTRACT_AbstractClass_v1 2026-05-20 mirror. KG: plan-prom16lag-l8-induction-2026-05-20"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "neo4j>=5.20.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
scientific = ["scikit-learn>=1.4", "networkx>=3.2", "scipy>=1.12"]

[project.scripts]
longinus-l8 = "pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "models",
  "validator",
  "quality_gate",
  "ged_drift_detector",
  "pipeline",
]
packages = ["induction_operators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

# deptry config for the l8 subpackage CI step
# (see .github/workflows/deptry-l8-subpkg.yml, vr-bhgman-442702e L2-F1 +
# vr-bhgman-e031271-deptry-l8-ci-3lens-2026-05-21 L1 honesty correction).
#
# HONEST DISCLOSURE (per Naesengmoon L1 finding 2026-05-21):
# At commit time, the only tracked l8 file with any imports is
# ged_drift_detector.py (dataclasses, typing) + tests/conftest.py
# (sys, pathlib). NONE of {neo4j, numpy, scikit-learn, networkx,
# scipy} are imported by tracked Python code.
#
# Pytest is the only honestly-needed entry: it is the declared test
# runner with no Python import surface. The remaining 5 are
# ASPIRATIONAL — kept in [project.dependencies] / [scientific extras]
# as a forward-declaration of the planned l8 pipeline surface
# (Naesengmoon Gate + Hybrid retrieval + Drift loop). Each is marked
# TODO(future-phase) below.
#
# If aspirational deps remain unused after 5 sprints, the honest action
# is to REMOVE them from pyproject [project.dependencies] / extras
# (downgrade to actual imports), NOT to keep silencing deptry.
[tool.deptry.per_rule_ignores]
DEP002 = [
  "pytest",       # test runner; never imported by package code (genuinely unused-in-code)
  # TODO(future-phase) — aspirational, not yet imported:
  "neo4j",        # planned: runtime KG client in pipeline stages
  "numpy",        # planned: numerical paths in induction_operators
  "scikit-learn", # planned: clustering for community phase
  "networkx",     # planned: hypergraph manipulation
  "scipy",        # planned: distance metrics for GED
]
