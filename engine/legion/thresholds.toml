value = 0.4
comparator = "less"
derivation_method = "hardcoded_pending_derivation"

# ─── Longinus ────────────────────────────────────────────────────────────
# T1-3: 이름·단위 정정 — sha256_drift_rate(0.05, 비율) 은 코드가 내는 키가 아니었다.
# 코드 정본 = sha256_drift_count (건수, invocation-log 실측; KG mention proxy 아님).
[[threshold]]
commander = "longinus"
target_commander = "occam"
metric = "sha256_drift_count"
value = 5.0
comparator = "greater"
derivation_method = "hardcoded_pending_derivation"

[[threshold]]
