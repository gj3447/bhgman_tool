# The RED artifact for the dispatch 폐루프 (G5-C5 소비자) flow.
#
# Written as the EXPECTATION of what the store must OBSERVE when the REAL chain
# seed(확신-dup 12그룹) -> legion run(발화) -> consume_dispatch(janitor 실행, σ게이트
# 상속 write) -> 재run(재발화 실측) runs. The store is the judge — a green self-report
# that silently never reached the store is exactly what this gate catches.
#
# Thresholds are not invented: 12 groups > 10 threshold fires EXACTLY one occam
# self-dispatch; the consumer executes it once (backlog cleared in one janitor pass on
# the local KG); the second run refires nothing => exactly one trigger_cleared. The
# discrimination proofs live in test_legion_dispatch_ooptdd.py: 10 groups => fired 0
# (==1 RED), apply=False => cleared 0 (==1 RED), drop=True => everything RED.
cid_env: OOPTDD_CID
service: bhgman.legion.dispatch

expect:
  # ── cardinality, value-pinned ────────────────────────────────────────────
  - event: dispatch_consume_started
    op: "=="
    count: 1

  # the seeded backlog really fires the occam self-dispatch — exactly once.
  - event: dispatch_decision_fired
    op: "=="
    count: 1

  # consumption is KG-observable: consumed_at events re-derived from the store,
  # status-pinned to the executed disposition (provenance-only skips don't count here).
  - event: dispatch_decision_consumed
    where: {status: executed}
    op: ">="
    count: 1

  # the allowlist edge (occam janitor) actually executed, with recorded efficacy 1
  # (the janitor's re-measure found the trigger condition gone).
  - event: dispatch_janitor_executed
    where: {outcome: 1}
    op: "=="
    count: 1

  # the loop's closure: no refire on the second run — the janitor cleared its trigger.
  - event: dispatch_trigger_cleared
    op: "=="
    count: 1

  # the consume pass closed in apply mode.
  - event: dispatch_consume_completed
    where: {dry_run: false}
    op: "=="
    count: 1

  # ── subset present, value-pinned ─────────────────────────────────────────
  - present:
      - {event: dispatch_decision_fired}
      - {event: dispatch_decision_consumed, where: {status: executed}}
      - {event: dispatch_trigger_cleared}

  # ── sequencing (novel axis): fire before consume before heal before close ─
  - must_order: [dispatch_consume_started, dispatch_decision_fired, dispatch_decision_consumed, dispatch_janitor_executed, dispatch_trigger_cleared, dispatch_consume_completed]
    within_s: 60

  # ── negative wing: the happy consume flow logs no ERROR ─────────────────
  - absent:
      where: {level: ERROR}
