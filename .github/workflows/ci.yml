# bhgman_tool CI
# KG: span-ci-github-actions-2026-05-13 (:AtomicSpan)
# Verification: pytest matrix + ruff + mypy + lean build (optional) on push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full git history — worked/03 test inspects commit history
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pip install uv
      - name: Run pytest (full engine suite)
        # #1 unified the flat-layout subpackages into the `engine` package, so the
        # whole suite imports `engine.*` and runs from repo root. Previously this
        # only ran engine/longinus_drift_audit/tests/ — a blind spot that let new
        # engines (prometheus/legion/kg_local) go untested in CI. Now full repo.
        run: |
          uv run --all-extras pytest -q --tb=short

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check engine/ || true  # initial baseline; tighten later
      - name: ruff format check
        run: ruff format --check engine/ || true

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: engine/longinus_drift_audit
        run: pip install -e . mypy
      - name: mypy
        working-directory: engine/longinus_drift_audit
        run: mypy --ignore-missing-imports --no-strict-optional . || true

  lean:
    name: lean build (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan.sh
          bash elan.sh -y --default-toolchain leanprover/lean4:4.29.1
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build all .lean files standalone
        run: |
          cd lean
          for f in *.lean; do
            echo "=== $f ==="
            lean "$f" || { echo "FAILED: $f"; exit 1; }
          done

  json-schema:
    name: plugin.json + marketplace.json schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate plugin.json
        run: jq empty plugins/.claude-plugin/plugin.json
      - name: Validate marketplace.json
        run: jq empty plugins/.claude-plugin/marketplace.json
