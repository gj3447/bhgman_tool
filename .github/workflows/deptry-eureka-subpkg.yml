name: deptry-eureka-subpkg
# Naesengmoon vr-bhgman-442702e-baseline-unblocking-3lens-2026-05-21 L2-F1 MED
# (formerly deptry-l8-subpkg; eureka-l8-rectification-2026-05-27 split renamed
#  engine/longinus_l8_induction → engine/eureka, drift부 → engine/longinus_drift)
# Root pyproject.toml's [tool.deptry] uses extend_exclude='engine/eureka'
# (eureka has its own pyproject). This workflow closes the blind spot by:
#   (1) running deptry inside the eureka subpackage with its own pyproject
#   (2) asserting that any eureka → root import resolves to a module already
#       listed in root's [tool.deptry] known_first_party (catch implicit
#       cross-package coupling that root's deptry no longer audits).
# KG: wqi-bhgman-l2f1-deptry-l8-subpkg-ci-step-2026-05-21, eureka-l8-rectification-2026-05-27

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  deptry-eureka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install uv
        run: pip install uv

      - name: deptry inside eureka subpackage
        working-directory: engine/eureka
        run: |
          uvx deptry . --ignore-notebooks

      - name: eureka -> root cross-import audit
        run: |
          python3 - <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          ROOT = Path(".").resolve()
          PKG_DIR = ROOT / "engine" / "eureka"

          with open(ROOT / "pyproject.toml", "rb") as f:
              root_cfg = tomllib.load(f)
          known_first_party = set(root_cfg["tool"]["deptry"]["known_first_party"])

          # Modules visible to a bare `from <name> import ...` from inside eureka:
          # (a) eureka's own flat modules, (b) Python stdlib (we don't audit), (c) declared
          # dependencies of either pyproject. We only flag imports that resolve to
          # *root engine subpackage names* not already in known_first_party.
          pkg_own = {
              p.stem
              for p in PKG_DIR.glob("*.py")
              if p.stem not in {"__init__", "conftest"}
          } | {
              p.parent.name
              for p in PKG_DIR.glob("*/__init__.py")
          }

          # Anything in root engine/ tree is a "root module"
          root_modules = {p.stem for p in (ROOT / "engine").glob("*/")} | {
              p.stem for p in (ROOT / "engine" / "longinus_drift_audit").glob("*.py")
              if p.stem not in {"__init__", "conftest"}
          }

          # L2 fix vr-bhgman-e031271 2026-05-21: tolerate leading whitespace
          # so indented imports inside TYPE_CHECKING / try / function bodies
          # are caught. Future upgrade: ast.parse for full correctness.
          import_pat = re.compile(r"^\s*(?:from|import)\s+([\w.]+)", re.MULTILINE)

          cross_imports = set()
          for py in PKG_DIR.rglob("*.py"):
              if "tests" in py.parts and py.name == "conftest.py":
                  continue
              text = py.read_text(encoding="utf-8", errors="ignore")
              for m in import_pat.finditer(text):
                  top = m.group(1).split(".")[0]
                  if top in pkg_own:
                      continue
                  if top in root_modules:
                      cross_imports.add(top)

          violations = cross_imports - known_first_party
          if violations:
              print(f"::error::eureka imports cross-package symbols NOT in root known_first_party: {sorted(violations)}", file=sys.stderr)
              sys.exit(1)
          if cross_imports:
              print(f"::notice::eureka -> root cross-imports OK (all in known_first_party): {sorted(cross_imports)}")
          else:
              print("::notice::eureka has no cross-imports into root engine modules.")
          PY
